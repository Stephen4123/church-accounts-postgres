services:
  # Web Application Service (Node.js + TypeScript + Express + Frontend)
  - type: web
    name: church-accounts-portal
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: AUTO_SEED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: church-accounts-db
          property: connectionString

databases:
  # Managed PostgreSQL Database on Render
  - name: church-accounts-db
    databaseName: church_accounts
    user: church_admin
    plan: free
    region: oregon

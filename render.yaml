services:
  # Web Application Service (Node.js + TypeScript + Express + Frontend)
  - type: web
    name: church-accounts-portal
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: AUTO_SEED
        value: "false"
      - key: DATABASE_URL
        sync: false
